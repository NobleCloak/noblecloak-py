# Builds the package once and publishes it from a version tag (`v*`), or builds only, when run by hand from a branch.
# The file is named publish.yml because PyPI's trusted publisher for `noblecloak` names this file, the repository
# NobleCloak/noblecloak-py and the `pypi-publish` environment; renaming any of the three breaks PyPI publishing.
#   build            builds the sdist and the wheel with `uv build`, writes SHA256SUMS next to (not inside) dist/, and
#                    keeps both as artifacts. Every other job takes those artifacts; nothing is built twice.
#   github release   tag runs in NobleCloak/noblecloak-py only: checks SHA256SUMS, then creates the GitHub Release with
#                    the distributions and SHA256SUMS. The only job that holds contents: write; it checks out and
#                    installs nothing (tests/test_publish_workflow.py enforces that too).
#   pypi publish     the same runs when the repository variable PUBLIC_RELEASE_ENABLED is 'true', after the GitHub
#                    Release job succeeded and the `pypi-publish` environment's reviewers approve. The only job that holds id-token: write; it
#                    installs nothing and runs no shell line (tests/test_publish_workflow.py enforces both).
# Outside NobleCloak/noblecloak-py only the build job runs: both later jobs name that repository.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/noblecloak/__init__.py)"
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the package version '$version'" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.9
          enable-cache: false
      - run: uv build
      - name: Write SHA256SUMS
        run: |
          mkdir sums
          (cd dist && sha256sum -- *) > sums/SHA256SUMS
          cat sums/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: sums/SHA256SUMS
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: github.ref_type == 'tag' && github.repository == 'NobleCloak/noblecloak-py'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: sums/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check --strict ../sums/SHA256SUMS)
          gh release create "$TAG" dist/* sums/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes

  publish:
    name: pypi publish
    needs: [build, release]
    if: github.ref_type == 'tag' && github.repository == 'NobleCloak/noblecloak-py' && vars.PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
