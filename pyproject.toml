[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "noblecloak"
dynamic = ["version"]
description = "NobleCloak governed approvals: the Python client for the /v1 module API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NobleCloak" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=50.0.2,<51",
  "httpx>=0.28.1,<0.29",
  "idna>=3.20,<4",
  "pydantic>=2.8.0,<3",
  "rfc8785>=0.1.4,<0.2",
]

[project.urls]
Repository = "https://github.com/NobleCloak/noblecloak-py"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.92.0",
  "hypothesis==6.170.15",
  "packaging==26.3",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.17.4",
  "types-pyyaml==6.0.12.20261103",
  "unasync==0.6.0",
]

[tool.hatch.version]
path = "src/noblecloak/__init__.py"

[tool.hatch.build.targets.sdist]
# An allowlist: nothing else in the working tree (runbooks, CI, provenance notes) goes into the sdist.
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/noblecloak"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Generated by `scripts/generate_models.py` from the spec; the schema's descriptions are long single-line strings.
"src/noblecloak/models.py" = ["E501"]
# The checks here return the error and a thin outer function raises it (see `credential.py`), one return per error.
"src/noblecloak/service_principal/*.py" = ["PLR0911"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Generated. The generator writes subclasses that narrow a field their parent declares, which strict pyright rejects:
# `PolicySetProposalTool.owner_kind` narrows `ToolWrite.owner_kind` to `Literal["org"]`.
# Imports of the models are still checked against what the file declares.
ignore = ["src/noblecloak/models.py"]
pythonVersion = "3.12"
extraPaths = ["scripts"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# `e2e` tests run against the pinned `nc-mock` (see CONTRIBUTING.md); the default run leaves them out and CI's
# `e2e / mock` job selects them with `-m e2e`.
markers = ["e2e: end-to-end tests against the pinned nc-mock; run with -m e2e"]
addopts = [
  "-m",
  "not e2e",
  "--strict-markers",
  "--cov=noblecloak",
  "--cov=check_private_deps",
  "--cov=generate_sync",
  "--cov=generate_models",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true

[tool.uv]
# `datamodel-code-generator` (dev) needs pydantic 2.12 on Python 3.14 and 2.14 on 3.15, so the floor of the runtime
# range can only be locked where it applies: below 3.14, which includes the Python CI runs (3.12) and 3.13. The floor
# is the first pydantic release whose pydantic-core has CPython 3.13 wheels. See CONTRIBUTING.md.
constraint-dependencies = ["pydantic==2.8.0; python_full_version < '3.14'"]
